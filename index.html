<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Todo App – Dejan</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">

<style>
/* -------------------- CSS -------------------- */

body {
	background-color: #000;
	font-family: 'Oswald', 'Futura', sans-serif;
	margin: 0; 
	padding: 0;
}

#page {
	background-color: #403c3b;
	margin: 0 auto 0 auto;
}

/* Hover Icons */
li span.trash-icon:hover,
li span.heart-icon:hover {
  color: red;
  transition: color 1s ease;
}

/* Logo */
h1 {
	background-image: url(https://via.placeholder.com/150);
	background-repeat: no-repeat;
	background-position: center center;
	text-align: center;
	text-indent: -1000%;
	height: 75px;
	line-height: 75px;
	width: 117px;
	margin: 0 auto 0 auto;
	padding: 30px 10px 20px 10px;
}

/* Überschrift */
h2 {
	color: #fff;
	font-size: 24px;
	font-weight: normal;
	text-align: center;
	text-transform: uppercase;
	letter-spacing: .2em;
	margin: 0 0 23px 0;
}

h2 span {
	border-radius: 50%;
	background-color: #000;
	font-size: 10px;
	text-align: center;
	display: inline-block;
	position: relative;
	top: -5px;
	height: 18px;
	width: 20px;
	margin-left: 5px;
	padding: 4px 0 0 4px;
}

/* Liste */
ul {
	background-color: #584f4d;
	border:none;
	padding: 0;
	margin: 0;
}

li {
	background-color: #ec8b68;
	color: #fff;
	border-top: 1px solid #fe9772;
	border-bottom: 1px solid #9f593f;
	font-size: 24px;
	letter-spacing: .05em;
	list-style-type: none;
	text-shadow: 2px 2px 1px #9f593f;
	height: 50px;
	padding-left: 1em;
	padding-top: 10px;
	transition: all 0.5s ease;
	transform: scale(1);
}

li span.trash-icon, 
li span.heart-icon {
	float: right;
	font-size:1.3em;
	line-height: 1.3em;
	margin-right: 0.5em;
	transition: color 1s ease;
}

li span.heart-icon {
	font-size:1em;
	line-height: 1.8em;
	vertical-align: bottom;
}

/* Hot */
.hot {
	background-color: #d7666b;
	color: #fff;
	text-shadow: 2px 2px 1px #914141;
	border-top: 1px solid #e99295;
	border-bottom: 1px solid #914141;
}

/* Cool */
.cool {
	background-color: #6cc0ac;
	color: #fff;
	text-shadow: 2px 2px 1px #3b6a5e;
	border-top: 1px solid #7ee0c9;
	border-bottom: 1px solid #3b6a5e;
}

/* Complete */
.complete {
	background-color: #999;
	color: #fff;
	background-image: url("https://via.placeholder.com/30");
	background-position: center right;
	background-repeat: no-repeat;
	border-top: 1px solid #666;
	text-shadow: 2px 2px 1px #333;
}

/* Input */
#inputField {
	box-sizing: border-box;
	border: 0;
	padding: 0.5em;
	width:100%;
	font-family: 'Oswald', 'Futura', sans-serif;
	font-size: 24px;
}

/* Trashzone */
#trashzone {
	color: white;
	text-align: center;
	transition: all 0.5s ease-in-out;
}

#trashzone span {
	font-size: 3em;
	font-weight: bolder;
	transition: all 0.5s ease-in-out;
}

.dragAndDropOpacity {
	opacity: 0;
}

.dragAndDropZoom {
	transform: scale(1.1,1.2);
	transition: all 0.3s ease-out;
}

[draggable=true] {
	cursor: grabbing;
}

[draggable=false] {
	cursor: not-allowed;
}

.trashIconTransform, .trashIconTransform>span {
	transform: scale(1.5,1.5);
	color: tomato;
	transition: all 0.5s ease-in-out;
}

#scriptResults {
	padding-bottom: 10px;
}
</style>
</head>

<body>
<div id="page">

	<h1>Logo</h1>
	<h2>Meine Liste <span>4</span></h2>

	<ul id="list">
		<li class="hot">Beispiel 1 <span class="trash-icon">🗑</span><span class="heart-icon">❤️</span></li>
		<li class="cool">Beispiel 2 <span class="trash-icon">🗑</span><span class="heart-icon">❤️</span></li>
		<li>Beispiel 3 <span class="trash-icon">🗑</span><span class="heart-icon">❤️</span></li>
		<li class="complete">Beispiel 4</li>
	</ul>

	<p>Dies ist ein Beispieltext, damit du siehst, wie dein CSS wirkt.</p>

	<input id="inputField" placeholder="Enter new item and press enter to save...">

	<div id="trashzone">
		<span>🗑</span>
	</div>

</div>

<!-- -------------------- JavaScript -------------------- -->
<script>
(() => {
  const inputField = document.getElementById('inputField');
  const list = document.getElementById('list');

  // Click-Handling für Herz + Trash
  list.addEventListener('click', (event) => {
    const target = event.target;

    // DELETE
    if (target.classList.contains('trash-icon')) {
      const li = target.closest('li');
      if (li) li.remove();
      return;
    }

    // TOGGLE HOT
    if (target.classList.contains('heart-icon')) {
      const li = target.closest('li');
      if (li) li.classList.toggle('hot');
      return;
    }
  });

  // Neues Item bei Enter
  inputField.addEventListener('keyup', (event) => {
    if (event.key !== 'Enter') return;

    const value = inputField.value.trim();
    if (!value) return;

    const li = document.createElement('li');
    li.setAttribute('draggable', 'true');

    li.appendChild(document.createTextNode(value + ' '));

    const trash = document.createElement('span');
    trash.className = 'trash-icon';
    trash.title = 'Delete';
    trash.innerHTML = '&#128465;';
    li.appendChild(trash);

    const heart = document.createElement('span');
    heart.className = 'heart-icon';
    heart.title = 'Hot';
    heart.innerHTML = '&#10084;';
    li.appendChild(heart);

    list.appendChild(li);
    inputField.value = '';
  });

  // Placeholder Verhalten
  inputField.addEventListener('focus', (event) => {
    event.target.removeAttribute('placeholder');
  });

  inputField.addEventListener('focusout', (event) => {
    event.target.setAttribute('placeholder', 'Enter new item and press enter to save...');
  });
})();
</script>

</body>
</html>
